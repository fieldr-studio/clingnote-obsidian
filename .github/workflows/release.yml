# Builds the three Obsidian release assets from a version tag.
# The tag must equal the version in manifest.json (no leading "v"), as the Community Plugins review requires.
name: Release
on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Check tag equals manifest version
        run: test "$(node -p "require('./manifest.json').version")" = "${GITHUB_REF_NAME}"
      - name: Create release with the three assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" main.js manifest.json styles.css             --title "${GITHUB_REF_NAME}"             --notes "ClingNote for Obsidian ${GITHUB_REF_NAME}. Requires the separate ClingNote companion for Windows, available at https://clingnote.com/obsidian"
